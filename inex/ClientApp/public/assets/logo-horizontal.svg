<!-- Coral card: spending; green card: earnings. -->
<path d="M25 111.5 L25 107 C25 91.5 33.5 81 47 76 L165 32 C176 28 184.5 33 188.5 43 L192 51 L56 99 C51 101 48 106 48 111.5 Z" fill="url(#expenseFill)"/>
