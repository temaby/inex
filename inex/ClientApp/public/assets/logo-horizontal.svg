<path d="M25 116 H229 Q236 116 236 123 V150 H201 C178 150 161 166 161 185 C161 204 178 220 201 220 H236 V223 C236 240 221 249 203 249 H58 C39 249 25 236 25 217 Z" fill="url(#walletFill)"/>
