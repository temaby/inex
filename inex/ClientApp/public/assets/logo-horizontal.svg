<svg xmlns="http://www.w3.org/2000/svg" width="352" height="128" viewBox="0 0 352 128" role="img" aria-label="InEx">
 <g transform="translate(0,0) scale(.44)">
<defs>
  <linearGradient id="walletFill" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0" stop-color="#3AAE91"/>
    <stop offset="0.58" stop-color="#179578"/>
    <stop offset="1" stop-color="#08775F"/>
  </linearGradient>
  <linearGradient id="expenseFill" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0" stop-color="#F18A66"/>
    <stop offset="1" stop-color="#D5503E"/>
  </linearGradient>
  <linearGradient id="incomeFill" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0" stop-color="#8AC9AF"/>
