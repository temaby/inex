<path d="M236 169 H203 C192 169 184 176 184 185 C184 194 192 202 203 202 H236 Z" fill="#0C8269"/>
<circle cx="205" cy="185.5" r="8.5" fill="#FFFFFF"/>
</g>
 <text x="132" y="94" fill="#10243A" font-family="Inter,Arial,Helvetica,sans-serif" font-weight="800" font-size="85" letter-spacing="-3.2">InEx</text>
